<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>goal</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      /* A command bar, not a window: no chrome, one input, and it leaves as soon as it is done. */
      /* The window's pixel height depends on the display's scaling, so the bar fills whatever it
         gets rather than being sized to a number that is right on one monitor and short on the
         next. */
      body {
        background: transparent;
        overflow: hidden;
        padding: 8px;
        height: 100%;
      }

      .bar {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r-lg);
        background: rgba(17, 28, 48, 0.97);
        border: 1px solid #2b3d5c;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        animation: rise 140ms cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .bar svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.8;
        stroke-linecap: round;
      }

      /* The bar is the focus indicator, not a ring inside it: there is one control, it is focused
         on open, and an outline around it reads as a second box rather than as focus. */
      input:focus-visible {
        outline: none;
      }

      .bar:focus-within {
        border-color: var(--accent-deep);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(56, 189, 248, 0.35);
      }

      input {
        flex: 1;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--ink);
        font: 400 16px/1.4 var(--sans);
        user-select: text;
      }

      input::placeholder {
        color: var(--ink-faint);
      }

      kbd {
        font: 500 10.5px/1 var(--mono);
        color: var(--ink-faint);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 6px;
        background: var(--surface-2);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
      <input id="barGoal" type="text" autocomplete="off" spellcheck="false" aria-label="Goal" placeholder="What do you want done?" />
      <kbd id="hint">Esc</kbd>
    </div>

    <script>
      const input = document.getElementById("barGoal");

      function finish(submit) {
        const value = submit ? input.value : "";
        // The bar is modal to the caller: the worker thread is parked until one of these lands.
        if (window.pywebview) window.pywebview.api[submit ? "submit" : "cancel"](value);
      }

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        if (e.key === "Escape") finish(false);
      });

      window.addEventListener("pywebviewready", () => input.focus());
      window.addEventListener("blur", () => document.getElementById("hint").textContent = "Esc");
      input.focus();
    </script>
  </body>
</html>
