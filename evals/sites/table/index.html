<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><style>body{font:17px Segoe UI,sans-serif;max-width:820px;margin:30px auto;padding:0 16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd;padding:8px 10px;text-align:left}th{background:#eef}th button{all:unset;cursor:pointer;font-weight:700}button.b{font:inherit;padding:5px 12px;margin:2px}input{font:inherit;padding:6px;width:260px}.pg{margin:14px 0;display:flex;gap:6px;align-items:center}#sel{margin-top:14px;background:#efe;padding:10px;display:none}</style></head><body>

<script>window.__ptrNoLoad=true</script><script src="/_report.js"></script>

function view(){let r=ROWS.filter(x=>x.name.toLowerCase().includes(f.toLowerCase()));r.sort((a,b)=>(a[key]>b[key]?1:a[key]<b[key]?-1:0)*dir);return r}
function draw(){const r=view(),pages=Math.max(1,Math.ceil(r.length/PER));if(page>pages)page=pages;
document.getElementById('tb').innerHTML=r.slice((page-1)*PER,page*PER).map(x=>'<tr><td>#'+x.id+'</td><td>'+x.name+'</td><td>'+x.status+'</td><td>$'+x.amount+'</td><td><button class="b" data-id="'+x.id+'">Select</button></td></tr>').join('');
document.getElementById('info').textContent='Page '+page+' of '+pages;
document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=pages;ptrReport('page-'+page,{page:page,filter:f,sort:key+(dir>0?' asc':' desc')},'Orders - page '+page+' of '+pages)}
document.getElementById('prev').onclick=()=>{page--;draw()};document.getElementById('next').onclick=()=>{page++;draw()};
document.getElementById('flt').oninput=e=>{f=e.target.value;page=1;draw()};
document.querySelectorAll('th button').forEach(b=>b.onclick=()=>{dir=key===b.dataset.k?-dir:1;key=b.dataset.k;page=1;draw()});
document.getElementById('tb').onclick=e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;const x=ROWS.find(r=>r.id==id);const s=document.getElementById('sel');s.style.display='block';s.textContent='Selected order #'+x.id+' for '+x.name;ptrReport('selected',{id:x.id,name:x.name},'Orders - selected '+x.id)};
draw();
