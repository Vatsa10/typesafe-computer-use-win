<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Shop</title><style>body{font:17px Segoe UI,sans-serif;max-width:760px;margin:30px auto;padding:0 16px}nav a{margin-right:14px}button,.btn{font:inherit;padding:9px 20px;background:#1a7f37;color:#fff;border:0;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}label{display:block;margin:12px 0 4px;font-weight:600}input{font:inherit;padding:8px;width:100%;box-sizing:border-box}.item{border:1px solid #ccd;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body><nav><a href="/shop/">Shop</a><a href="/shop/cart.html">Cart (<span id="cc">0</span>)</a><a href="/shop/login.html">Sign in</a></nav><h1>Notebook Shop</h1><div class="item"><span>Pocket notebook - $6</span><button data-p="Pocket notebook" data-c="6">Add to cart</button></div><div class="item"><span>Desk notebook - $12</span><button data-p="Desk notebook" data-c="12">Add to cart</button></div><div class="item"><span>Fountain pen - $18</span><button data-p="Fountain pen" data-c="18">Add to cart</button></div><script src="/_report.js"></script><script>const cart=()=>{try{return JSON.parse(sessionStorage.getItem('cart')||'[]')}catch(e){return[]}};const setCart=c=>{try{sessionStorage.setItem('cart',JSON.stringify(c))}catch(e){}};document.getElementById('cc').textContent=cart().length;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const c=cart();c.push({p:b.dataset.p,c:+b.dataset.c});setCart(c);document.getElementById('cc').textContent=c.length;ptrReport('added-to-cart',{product:b.dataset.p,count:c.length},'Notebook Shop - added '+b.dataset.p)})</script></body></html>
