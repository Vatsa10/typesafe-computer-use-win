<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Shop - Cart</title><style>body{font:17px Segoe UI,sans-serif;max-width:760px;margin:30px auto;padding:0 16px}nav a{margin-right:14px}button,.btn{font:inherit;padding:9px 20px;background:#1a7f37;color:#fff;border:0;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}label{display:block;margin:12px 0 4px;font-weight:600}input{font:inherit;padding:8px;width:100%;box-sizing:border-box}.item{border:1px solid #ccd;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body><nav><a href="/shop/">Shop</a><a href="/shop/cart.html">Cart (<span id="cc">0</span>)</a><a href="/shop/login.html">Sign in</a></nav><h1>Your cart</h1><div id="items"></div><p id="tot"></p><a class="btn" id="co" href="/shop/checkout.html">Checkout</a><script src="/_report.js"></script><script>const cart=()=>{try{return JSON.parse(sessionStorage.getItem('cart')||'[]')}catch(e){return[]}};const setCart=c=>{try{sessionStorage.setItem('cart',JSON.stringify(c))}catch(e){}};document.getElementById('cc').textContent=cart().length;const c=cart();document.getElementById('items').innerHTML=c.length?c.map(i=>'<div class="item">'+i.p+' - $'+i.c+'</div>').join(''):'<p>The cart is empty.</p>';document.getElementById('tot').textContent='Total: $'+c.reduce((a,i)=>a+i.c,0)</script></body></html>
