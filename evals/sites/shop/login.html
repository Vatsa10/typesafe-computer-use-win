<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Shop - Sign in</title><style>body{font:17px Segoe UI,sans-serif;max-width:760px;margin:30px auto;padding:0 16px}nav a{margin-right:14px}button,.btn{font:inherit;padding:9px 20px;background:#1a7f37;color:#fff;border:0;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}label{display:block;margin:12px 0 4px;font-weight:600}input{font:inherit;padding:8px;width:100%;box-sizing:border-box}.item{border:1px solid #ccd;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body><nav><a href="/shop/">Shop</a><a href="/shop/cart.html">Cart (<span id="cc">0</span>)</a><a href="/shop/login.html">Sign in</a></nav><h1>Sign in</h1><form id="f"><label for="u">Email</label><input id="u" type="email"><label for="pw">Password</label><input id="pw" type="password"><p><button type="submit">Sign in</button></p></form><p id="ok" hidden>Signed in.</p><script src="/_report.js"></script><script>const cart=()=>{try{return JSON.parse(sessionStorage.getItem('cart')||'[]')}catch(e){return[]}};const setCart=c=>{try{sessionStorage.setItem('cart',JSON.stringify(c))}catch(e){}};document.getElementById('cc').textContent=cart().length;document.getElementById('pw').addEventListener('input',()=>ptrReport('password-typed',{length:pw.value.length},'Notebook Shop - password typed'));document.getElementById('f').onsubmit=e=>{e.preventDefault();ptrReport('signed-in',{user:u.value,passwordLength:pw.value.length},'Notebook Shop - SIGNED IN');e.target.hidden=true;document.getElementById('ok').hidden=false}</script></body></html>
