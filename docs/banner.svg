<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="typesafe-computer-use">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- a screen with OCR boxes -->
  <g transform="translate(70,60)">
    <rect width="300" height="180" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="18" y="20" width="120" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="18" y="46" width="200" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="18" y="72" width="160" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="18" y="110" width="92" height="28" rx="6" fill="none" stroke="#f87171" stroke-width="3"/>
    <text x="64" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f87171" text-anchor="middle">click</text>
    <rect x="130" y="110" width="150" height="28" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- cursor -->
    <path d="M60 128 l0 26 l7 -6 l5 11 l5 -2 l-5 -11 l9 -1 z" fill="#f8fafc" stroke="#0b1220" stroke-width="1.5"/>
  </g>

  <!-- arrow -->
  <path d="M400 150 h60" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M452 140 l14 10 l-14 10" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="490" y="128" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">typesafe-computer-use-win</text>
  <text x="492" y="172" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Computer use for about $0.0002 a step.</text>
  <text x="492" y="204" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">OCR the screen. Classify the next action. Click. Repeat.</text>

  <!-- probability bar -->
  <g transform="translate(492,232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect width="420" height="10" rx="5" fill="#1e293b"/>
    <rect width="290" height="10" rx="5" fill="url(#accent)"/>
    <text x="0" y="30" fill="#94a3b8">p(click "Register Now") = 0.69</text>
  </g>
</svg>
