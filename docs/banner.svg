<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Pointer: an AI buddy for your Windows desktop">
  <title>Pointer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.6" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#60cdff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60cdff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8cff"/>
      <stop offset="1" stop-color="#005fb8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#131b30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(72 92)">
    <rect width="76" height="76" rx="20" fill="url(#mark)" filter="url(#shadow)"/>
    <path d="M25 19l34 19.5-14.6 3.8 8.2 15.4-6.8 3.7-8.2-15.4L26.9 57z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="168" y="148" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Pointer</text>
  <text x="74" y="214" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#c9d6ee">An AI buddy for your Windows desktop.</text>
  <text x="74" y="250" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#8a9bbb">It sees your screen, points the way, and does it.</text>

  <!-- chips -->
  <g font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="74" y="276" width="104" height="30" rx="15" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.45"/>
    <text x="126" y="296" text-anchor="middle" fill="#9fdcff">teaches</text>
    <rect x="188" y="276" width="78" height="30" rx="15" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.45"/>
    <text x="227" y="296" text-anchor="middle" fill="#9fdcff">acts</text>
    <rect x="276" y="276" width="104" height="30" rx="15" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.45"/>
    <text x="328" y="296" text-anchor="middle" fill="#9fdcff">dictates</text>
    <rect x="390" y="276" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="465" y="296" text-anchor="middle" fill="#c9d6ee">$0.0002 / step</text>
  </g>

  <!-- a mock app window being taught -->
  <g transform="translate(700 58)" filter="url(#shadow)">
    <rect width="440" height="226" rx="14" fill="url(#window)" stroke="#2c3a5c"/>
    <text x="24" y="25" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#7f8db0">Report.docx</text>
    <g stroke="#7f8db0" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M352 20h12"/>
      <rect x="380" y="14" width="11" height="11" rx="1.5"/>
      <path d="M408 14l11 11M419 14l-11 11"/>
    </g>
    <g font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa8c4">
      <text x="24" y="58">File</text>
      <text x="74" y="58">Edit</text>
      <text x="124" y="58">View</text>
      <text x="178" y="58">Help</text>
    </g>
    <line x1="0" y1="72" x2="440" y2="72" stroke="#2c3a5c"/>
    <rect x="24" y="92" width="250" height="10" rx="5" fill="#2a3757"/>
    <rect x="24" y="114" width="320" height="10" rx="5" fill="#243050"/>
    <rect x="24" y="136" width="200" height="10" rx="5" fill="#243050"/>
    <!-- the target -->
    <rect x="290" y="168" width="126" height="38" rx="8" fill="#005fb8"/>
    <text x="353" y="192" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Export PDF</text>
    <rect x="284" y="162" width="138" height="50" rx="11" fill="none" stroke="#60cdff" stroke-width="2.5"/>
  </g>

  <!-- the glide path and the buddy -->
  <path d="M600 312 C 760 330, 930 300, 1012 272" fill="none" stroke="#60cdff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.8"/>
  <circle cx="600" cy="312" r="4" fill="#60cdff" opacity="0.6"/>
  <g transform="translate(1004 262)">
    <path d="M0 0l30 17.2-12.9 3.4 7.2 13.6-6 3.3-7.2-13.6L1.7 33.6z" fill="#60cdff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1036 284)" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect width="150" height="34" rx="17" fill="#0b1324" stroke="#60cdff" stroke-width="1.5"/>
    <rect x="6" y="6" width="36" height="22" rx="11" fill="#60cdff"/>
    <text x="24" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#00223a">2/2</text>
    <text x="52" y="22" font-size="13" fill="#dbe8ff">Click Export</text>
  </g>
</svg>
