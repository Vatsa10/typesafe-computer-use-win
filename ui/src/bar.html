<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pointer</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* A Fluent flyout, not a window: no chrome, one line, gone as soon as it has an answer. Its
         height comes from the window it is given, because a window sized in CSS pixels is a
         different height on a scaled display. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        padding: var(--space-3) var(--space-4) var(--space-5);
        font: 400 var(--type-body) / 20px var(--font-text);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      .flyout {
        height: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 0 var(--space-2) 0 var(--space-3);
        border-radius: var(--radius-card);
        background: var(--surface-flyout);
        backdrop-filter: blur(40px) saturate(1.4);
        box-shadow: var(--elevation-flyout);
        animation: rise var(--dur-normal) var(--ease-out);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
      }

      .logo {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
      }

      .icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* The flyout is the focus indicator: one control, focused on open, so the accent underline
         below the field is the ring. */
      .input-wrap {
        flex: 1;
        min-width: 0;
        align-self: stretch;
        display: flex;
        align-items: center;
        position: relative;
      }

      .input-wrap::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        height: 2px;
        border-radius: var(--radius-pill);
        background: var(--accent);
        transform: scaleX(0);
        transition: transform var(--dur-normal) var(--ease-out);
      }

      .input-wrap:focus-within::after {
        transform: scaleX(1);
      }

      #barGoal {
        width: 100%;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--text-primary);
        font: 400 16px/24px var(--font-text);
      }

      #barGoal::placeholder {
        color: var(--text-tertiary);
      }

      .mic {
        position: relative;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1px solid var(--stroke);
        border-radius: 50%;
        background: var(--control);
        color: var(--text-secondary);
        cursor: default;
        transition: background-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
      }

      .mic:hover {
        background: var(--control-hover);
        color: var(--text-primary);
      }

      .mic:active {
        transform: scale(0.94);
      }

      .mic:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }

      .mic .icon {
        width: 18px;
        height: 18px;
      }

      .mic::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
      }

      .mic.live {
        background: var(--accent);
        border-color: transparent;
        color: var(--text-on-accent);
      }

      .mic.live::before {
        animation: ripple 1.4s var(--ease-out) infinite;
      }

      @keyframes ripple {
        from {
          opacity: 0.7;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(1.5);
        }
      }

      .mic.busy .icon {
        color: var(--accent);
        animation: spin 900ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hint {
        flex: 0 0 auto;
        min-width: 44px;
        text-align: center;
        font-size: var(--type-caption);
        color: var(--text-tertiary);
        white-space: nowrap;
      }

      kbd {
        display: inline-block;
        padding: 2px 6px;
        border-radius: var(--radius-control);
        border: 1px solid var(--stroke-strong);
        background: var(--control);
        font: 600 11px/14px var(--font-text);
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="flyout" id="bar">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)" />
        <path d="M8 6.5l9 5.2-3.9 1 2.2 4.1-1.8 1-2.2-4.1L8.5 16.6z" fill="var(--text-on-accent)" stroke="var(--text-on-accent)" stroke-width="1" stroke-linejoin="round" />
      </svg>
      <div class="input-wrap">
        <input id="barGoal" type="text" autocomplete="off" spellcheck="false" aria-label="Goal for Pointer" placeholder="Ask Pointer to do something" />
      </div>
      <span class="hint" id="hint" aria-live="polite"><kbd>Esc</kbd></span>
      <button class="mic" id="mic" type="button" aria-label="Speak the goal" title="Click, speak, click again">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
      </button>
    </div>

    <script>
      const input = document.getElementById("barGoal");
      const mic = document.getElementById("mic");
      const hint = document.getElementById("hint");
      const MIC = mic.innerHTML;
      const SPINNER = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" /></svg>';
      const IDLE_HINT = "<kbd>Esc</kbd>";
      let listening = false;
      let closing = false;

      function finish(submit, spoken) {
        if (closing) return;
        closing = true;
        const value = submit ? input.value.trim() : "";
        // A typed line is a goal. A spoken one is classified first, because "stop" and "never mind"
        // arrive as text too, and only one of those is work.
        window.bar.done(value, Boolean(spoken));
      }

      function flash(text) {
        hint.textContent = text;
        setTimeout(() => (hint.innerHTML = IDLE_HINT), 1800);
      }

      async function toggleMic() {
        if (listening) {
          // Second click: stop, transcribe, and run what it heard.
          listening = false;
          mic.classList.remove("live");
          mic.classList.add("busy");
          mic.innerHTML = SPINNER;
          mic.setAttribute("aria-label", "Transcribing");
          hint.textContent = "Transcribing";
          const reply = await window.core.call("listen_stop");
          mic.classList.remove("busy");
          mic.innerHTML = MIC;
          mic.setAttribute("aria-label", "Speak the goal");
          const heard = reply && reply.ok ? reply.result.heard : "";
          if (heard) {
            input.value = heard;
            finish(true, true); // speaking is the whole instruction; there is nothing left to confirm
          } else {
            flash("Nothing heard");
          }
          return;
        }
        const reply = await window.core.call("listen_start");
        const started = reply && reply.ok && reply.result.listening;
        if (!started) {
          flash("No mic");
          return;
        }
        listening = true;
        mic.classList.add("live");
        mic.setAttribute("aria-label", "Stop listening");
        hint.textContent = "Listening";
      }

      mic.addEventListener("click", toggleMic);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true, false);
        if (e.key === "Escape") {
          if (listening) {
            toggleMic();
          } else {
            finish(false);
          }
        }
      });

      window.addEventListener("DOMContentLoaded", () => {
        input.focus();
        // Opening straight into listening is the point of the hotkey: press it, speak, done.
        if (window.bar.listenOnOpen) toggleMic();
      });
    </script>
  </body>
</html>
