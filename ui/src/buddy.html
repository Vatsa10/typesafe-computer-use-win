<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pointer buddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* The cursor buddy. The window is transparent, click-through and moved by the shell; this page
         only draws the arrow (its tip at 8,6 in window coordinates, which main.js parks on the target)
         and the label bubble beside it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }

      .buddy {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity var(--dur-normal) var(--ease-out);
      }
      .buddy.on {
        opacity: 1;
      }

      .arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 34px;
        filter: drop-shadow(0 2px 3px #00000040);
        animation: bob 2.4s ease-in-out infinite;
        transform-origin: 8px 6px;
      }

      .bubble {
        position: absolute;
        left: 26px;
        top: 32px;
        max-width: 260px;
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 12px 7px 8px;
        border-radius: 16px;
        border: 1.5px solid var(--mark);
        background: var(--surface-solid);
        color: var(--text-primary);
        font: 600 13px/18px var(--font-text);
        box-shadow: 0 0 0 3px var(--mark-glow), var(--elevation-flyout);
        animation: bob 2.4s ease-in-out infinite;
      }
      .bubble.empty {
        display: none;
      }
      .bubble.note {
        border-color: var(--warning);
        box-shadow: 0 0 0 3px var(--warning-subtle), var(--elevation-flyout);
      }

      .chip {
        flex: none;
        padding: 0 7px;
        border-radius: var(--radius-pill);
        background: var(--mark);
        color: var(--text-on-accent);
        font: 700 11px/18px var(--font-text);
        font-variant-numeric: tabular-nums;
      }
      .note .chip {
        background: var(--warning);
        color: var(--surface-solid);
      }
      .chip:empty {
        display: none;
      }

      .text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .arrow,
        .bubble {
          animation: none;
        }
        .buddy {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="buddy" id="buddy">
      <svg class="arrow" viewBox="0 0 30 34" aria-hidden="true">
        <path
          d="M8 6 L8 28 L13.6 22.6 L17.6 31 L21.4 29.2 L17.4 21 L25 20.4 Z"
          fill="var(--mark)"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linejoin="round"
        />
      </svg>
      <div class="bubble empty" id="bubble"><span class="chip" id="chip"></span><span class="text" id="text"></span></div>
    </div>
    <script>
      const buddy = document.getElementById("buddy");
      const bubble = document.getElementById("bubble");
      window.core.on((message) => {
        if (message.event === "buddy-hide") return buddy.classList.remove("on");
        if (message.event !== "buddy") return;
        const hasStep = Number.isFinite(message.step) && Number.isFinite(message.of);
        document.getElementById("chip").textContent = hasStep ? `${message.step}/${message.of}` : "";
        document.getElementById("text").textContent = message.label || "";
        bubble.className = "bubble" + (message.tone === "note" ? " note" : "") + (message.label || hasStep ? "" : " empty");
        buddy.classList.add("on");
      });
    </script>
  </body>
</html>
