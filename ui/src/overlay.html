<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pointer highlight</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* A pane nobody can touch: the window is transparent and ignores the mouse, so this page only
         ever draws. Boxes arrive already in this window's own coordinates. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .mark {
        position: absolute;
        box-sizing: border-box;
        border-radius: var(--radius-card);
        border: 2px solid var(--mark);
        box-shadow: 0 0 0 4px var(--mark-glow), var(--elevation-flyout);
        animation: pop var(--dur-slow) var(--ease-out);
      }

      .mark.note {
        border-color: var(--warning);
        border-style: dashed;
        box-shadow: 0 0 0 4px var(--warning-subtle);
      }

      .tag {
        position: absolute;
        max-width: 360px;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        background: var(--mark);
        color: var(--text-on-accent);
        font: 600 12px/16px var(--font-text);
        box-shadow: var(--elevation-flyout);
        animation: pop var(--dur-slow) var(--ease-out);
      }

      .tag.note {
        background: var(--warning);
        color: var(--surface-solid);
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }

      /* Shapes. A mark names one (box | circle | arrow | underline | note | step); anything else is a box. */
      .mark.circle {
        border-radius: 50%;
      }

      .mark.underline {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        height: 0 !important;
      }
      .mark.underline::after {
        content: "";
        position: absolute;
        left: -2px;
        right: -2px;
        top: 2px;
        height: 4px;
        border-radius: var(--radius-pill);
        background: var(--mark);
        box-shadow: 0 0 0 3px var(--mark-glow);
      }

      .mark.arrow {
        border: 0;
        box-shadow: none;
        animation: none;
      }
      .mark.arrow svg {
        position: absolute;
        left: -30px;
        top: 50%;
        width: 28px;
        height: 28px;
        margin-top: -14px;
        overflow: visible;
        filter: drop-shadow(0 2px 3px #00000040);
        animation: nudge 1.2s var(--ease-standard) infinite;
      }
      @keyframes nudge {
        50% {
          transform: translateX(3px);
        }
      }

      .mark.step .badge {
        position: absolute;
        left: -12px;
        top: -12px;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        border-radius: var(--radius-pill);
        background: var(--mark);
        color: var(--text-on-accent);
        font: 700 13px/24px var(--font-text);
        font-variant-numeric: tabular-nums;
        box-shadow: 0 0 0 2px var(--surface-solid), var(--elevation-flyout);
      }

      /* A note: a short card over the target, text wraps to two lines. */
      .tag.card {
        max-width: 240px;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        border-radius: var(--radius-card);
        background: var(--warning-subtle);
        color: var(--text-primary);
        border: 1px solid var(--warning);
      }

      @media (prefers-reduced-motion: reduce) {
        .mark.arrow svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      const SHAPES = new Set(["box", "circle", "arrow", "underline", "note", "step"]);
      window.core.on((message) => {
        if (message.event !== "draw") return;
        document.body.innerHTML = "";
        for (const m of message.marks) {
          const shape = SHAPES.has(m.shape) ? m.shape : "box"; // unknown draws a box
          const note = m.tone === "note" || shape === "note";
          const box = document.createElement("div");
          box.className = "mark " + shape + (note ? " note" : "");
          Object.assign(box.style, { left: m.x + "px", top: m.y + "px", width: m.w + "px", height: m.h + "px" });
          if (shape === "arrow") {
            // Points right, at the target's left edge.
            box.innerHTML =
              '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 14h20M14 5l9 9-9 9" fill="none" stroke="var(--mark)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          }
          if (shape === "step") {
            const badge = document.createElement("span");
            badge.className = "badge";
            const n = m.step ?? m.n;
            badge.textContent = n === undefined || n === null ? "•" : String(n);
            box.appendChild(badge);
          }
          document.body.appendChild(box);
          if (!m.label) continue;
          const tag = document.createElement("div");
          tag.className = "tag " + (note ? "note" : "") + (shape === "note" ? " card" : "");
          tag.textContent = m.label;
          // Above the box when there is room, otherwise just inside it: a label off the top of the
          // window is a label nobody reads. A note card is two lines tall, so it needs more room.
          const room = shape === "note" ? 50 : 26;
          Object.assign(tag.style, { left: m.x + "px", top: (m.y > room ? m.y - room : m.y + 6) + "px" });
          document.body.appendChild(tag);
        }
      });
    </script>
  </body>
</html>
