<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>winclicker-highlight</title>
    <style>
      /* A pane nobody can touch: the window is transparent and ignores the mouse, so this page only
         ever draws. Boxes arrive already in this window's own coordinates. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .mark {
        position: absolute;
        border-radius: 10px;
        border: 3px solid #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16), 0 10px 30px rgba(0, 0, 0, 0.35);
        animation: pop 220ms cubic-bezier(0.2, 0, 0, 1);
      }

      .mark.note {
        border-color: #fbbf24;
        border-style: dashed;
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.14);
      }

      .tag {
        position: absolute;
        padding: 5px 11px;
        border-radius: 999px;
        white-space: nowrap;
        background: #0b1120;
        color: #7dd3fc;
        border: 1px solid #38bdf8;
        font: 600 12px/1 "Cascadia Mono", Consolas, monospace;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        animation: pop 220ms cubic-bezier(0.2, 0, 0, 1);
      }

      .tag.note {
        color: #fcd34d;
        border-color: #fbbf24;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      window.core.on((message) => {
        if (message.event !== "draw") return;
        document.body.innerHTML = "";
        for (const m of message.marks) {
          const box = document.createElement("div");
          box.className = "mark " + (m.tone === "note" ? "note" : "");
          Object.assign(box.style, { left: m.x + "px", top: m.y + "px", width: m.w + "px", height: m.h + "px" });
          document.body.appendChild(box);
          if (!m.label) continue;
          const tag = document.createElement("div");
          tag.className = "tag " + (m.tone === "note" ? "note" : "");
          tag.textContent = m.label;
          // Above the box when there is room, otherwise just inside it: a label off the top of the
          // window is a label nobody reads.
          Object.assign(tag.style, { left: m.x + "px", top: (m.y > 26 ? m.y - 26 : m.y + 6) + "px" });
          document.body.appendChild(tag);
        }
      });
    </script>
  </body>
</html>
