<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pointer highlight</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* A pane nobody can touch: the window is transparent and ignores the mouse, so this page only
         ever draws. Boxes arrive already in this window's own coordinates. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .mark {
        position: absolute;
        box-sizing: border-box;
        border-radius: var(--radius-card);
        border: 2px solid var(--mark);
        box-shadow: 0 0 0 4px var(--mark-glow), var(--elevation-flyout);
        animation: pop var(--dur-slow) var(--ease-out);
      }

      .mark.note {
        border-color: var(--warning);
        border-style: dashed;
        box-shadow: 0 0 0 4px var(--warning-subtle);
      }

      .tag {
        position: absolute;
        max-width: 360px;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        background: var(--mark);
        color: var(--text-on-accent);
        font: 600 12px/16px var(--font-text);
        box-shadow: var(--elevation-flyout);
        animation: pop var(--dur-slow) var(--ease-out);
      }

      .tag.note {
        background: var(--warning);
        color: var(--surface-solid);
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
    </style>
  </head>
  <body>
    <script>
      window.core.on((message) => {
        if (message.event !== "draw") return;
        document.body.innerHTML = "";
        for (const m of message.marks) {
          const box = document.createElement("div");
          box.className = "mark " + (m.tone === "note" ? "note" : "");
          Object.assign(box.style, { left: m.x + "px", top: m.y + "px", width: m.w + "px", height: m.h + "px" });
          document.body.appendChild(box);
          if (!m.label) continue;
          const tag = document.createElement("div");
          tag.className = "tag " + (m.tone === "note" ? "note" : "");
          tag.textContent = m.label;
          // Above the box when there is room, otherwise just inside it: a label off the top of the
          // window is a label nobody reads.
          Object.assign(tag.style, { left: m.x + "px", top: (m.y > 26 ? m.y - 26 : m.y + 6) + "px" });
          document.body.appendChild(tag);
        }
      });
    </script>
  </body>
</html>
